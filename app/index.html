<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pooled Drive: web app</title>
<meta name="description" content="Pool the free space of your own Google accounts into one cloud, in your browser.">
<meta name="theme-color" content="#070b16">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pooled Drive">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<script>
  // apply the saved theme before anything paints, so there is no flash
  try {
    var t = JSON.parse(localStorage.getItem('pd.theme') || '"auto"');
    document.documentElement.dataset.theme = t === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t;
  } catch (e) {}
</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--a1)"/><stop offset="1" style="stop-color:var(--a2)"/></linearGradient></defs></svg>
<div id="app"></div>
<div class="scrim" id="scrim"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="tx" aria-live="polite"></div>
<div class="drop" id="dz"><div>Drop files to upload</div></div>
<canvas id="fx" aria-hidden="true"></canvas>
<input type="file" id="pick" multiple hidden>
<noscript><p style="padding:40px;text-align:center">Pooled Drive needs JavaScript to run.</p></noscript>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="ui.js"></script>
</body>
</html>
